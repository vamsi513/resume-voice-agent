line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E501: long lines are almost all prose in prompt strings and comments.
ignore = ["E501"]

[lint.per-file-ignores]
# Eval scripts and tests import after sys.path manipulation by necessity.
"eval/*" = ["E402"]
"scripts/*" = ["E402"]
"tests/conftest.py" = ["E402"]
